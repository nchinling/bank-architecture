<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RP Digital Bank - Reference App</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <h1>RP Digital Bank</h1>
    <div id="user-bar" class="hidden">
      <span id="who"></span>
      <button id="logout-btn">Log out</button>
    </div>
  </header>

  <main>
    <!-- Logged-out view -->
    <section id="login-view">
      <p>A minimal reference client showing how any app plugs into the sandbox:
         log in with Keycloak, then call the gateway APIs with the token and API key.</p>
      <button id="login-btn">Log in</button>
      <p class="hint">Try user <code>alice</code> / <code>password</code>.</p>
    </section>

    <!-- Logged-in view -->
    <section id="app-view" class="hidden">
      <h2>Your accounts</h2>
      <table id="accounts-table">
        <thead>
          <tr><th>Account</th><th>Type</th><th>Balance</th><th>Currency</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <h2>Statement <small id="statement-account"></small></h2>
      <table id="txn-table">
        <thead>
          <tr><th>Date</th><th>Direction</th><th>Amount</th><th>Description</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <h2>Make a transfer</h2>
      <form id="transfer-form">
        <label>From <input name="fromAccount" placeholder="ACC-1001" required /></label>
        <label>To <input name="toAccount" placeholder="ACC-1002" required /></label>
        <label>Amount <input name="amount" type="number" step="0.01" min="0.01" placeholder="100.00" required /></label>
        <label>Note <input name="description" placeholder="pocket money" /></label>
        <button type="submit">Transfer</button>
      </form>
      <p id="transfer-result" class="result"></p>
    </section>
  </main>

  <!-- keycloak-js from CDN; no build step needed -->
  <script src="https://cdn.jsdelivr.net/npm/keycloak-js@25.0.6/dist/keycloak.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
