# The four banking services. Each image is built from its Dockerfile and must be
# available to the cluster (e.g. loaded into kind/minikube or pushed to a registry).
# Images are referenced by a simple local tag here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: rp-sandbox/customer-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sandbox-config
            - secretRef:
                name: sandbox-db
          env:
            - name: DB_NAME
              value: sandbox_customer
            - name: PROVIDER_KYC
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: PROVIDER_KYC
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  selector:
    app: customer-service
  ports:
    - port: 8082
      targetPort: 8082
---
