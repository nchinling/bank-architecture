# Gateway Deployment + Service + Ingress (the single public entry point).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: rp-sandbox/gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SANDBOX_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: SANDBOX_ISSUER_URI
            - name: CUSTOMER_URI
              value: http://customer-service:8082
            - name: ACCOUNT_URI
              value: http://account-service:8083
            - name: TRANSACTION_URI
              value: http://transaction-service:8084
            - name: PAYMENT_URI
              value: http://payment-service:8085
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8081
      targetPort: 8081
---
# Ingress exposes the gateway as the single entry point. Requires an ingress
# controller in the cluster (e.g. ingress-nginx on kind/minikube).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-ingress
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8081
